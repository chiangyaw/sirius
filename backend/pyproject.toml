[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sirius"
version = "0.1.0"
description = "Sirius — multi-agent, multi-skill security demo platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "anthropic[vertex]>=0.40",
    "playwright>=1.62",
]

[project.optional-dependencies]
# Prisma AIRS (AI Runtime Security) SDK
airs = ["pan-aisecurity>=0.11"]
# Purple-team intrusive path (SSH to Kali box)
purpleteam = ["paramiko>=3.4"]
# Cortex platform MCP server: the MCP SDK + the external cortex-mcp bridge
# (github.com/chiangyaw/cortex-mcp) Sirius consumes over stdio (see CortexMcpConfig).
mcp = ["mcp>=1.2", "cortex-mcp @ git+https://github.com/chiangyaw/cortex-mcp.git"]
# AWS preflight / helpers
aws = ["boto3>=1.34"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = [
    "pan-aisecurity>=0.11",
    "paramiko>=3.4",
    "mcp>=1.2",
    "cortex-mcp @ git+https://github.com/chiangyaw/cortex-mcp.git",
    "boto3>=1.34",
]

[project.scripts]
sirius = "sirius.ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sirius*"]

[tool.setuptools.package-data]
sirius = ["scenarios/data/*.json", "web_dist/**/*"]
